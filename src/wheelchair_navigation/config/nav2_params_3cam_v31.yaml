###############################################################################
# NAV2 PARAMETERS - 3-CAMERA SAFE WHEELCHAIR CONFIGURATION (v31, TURN DON'T REVERSE)
###############################################################################
# Based on: nav2_params_3cam_v29.yaml (the real-chair config, SmacPlanner2D)
# Created: 2026-11-05
# Pairs with: wheelchair_fusion_nav.launch.py, scan_fusion_v9, 3x RealSense,
#             behavior_tree/wheelchair_robust_nav_v3.xml
#
# GOAL: when the goal is behind the chair, it turns in place (a U-turn) and
# drives forward, instead of reversing the whole way. On the real chair, v29
# with allow_reversing true drove purely backwards to goals behind it.
#
# CHANGES vs v29 (controller_server and costmap inflation only; the planner
# stays SmacPlanner2D, not v30's Hybrid-A* tuned in simulation):
#   1. RPP allow_reversing: true -> false. RPP no longer reverses when its
#      lookahead point falls behind the chair.
#   2. RPP use_rotate_to_heading: false -> true, rotate_to_heading_min_angle
#      0.35 -> 0.785 (45 deg). Above 45 deg off the path, the chair turns in
#      place to face it; smaller angles are driven as curves.
#   3. RPP max_angular_accel: 0.8 -> 3.2. RPP ramps each turn command from the
#      measured spin, so at 0.8 a turn from rest starts at 0.04 rad/s and can
#      stall; the velocity smoother still limits the ramp to 0.8 rad/s^2.
#   4. RPP use_collision_detection: false -> true. RPP stops before the
#      footprint would hit an obstacle within 1.0 s of motion, in-place turns
#      included.
#   5. Progress checker SimpleProgressChecker -> PoseProgressChecker
#      (required_movement_angle 0.5 rad, movement_time_allowance 4.0 -> 10.0).
#      The simple checker counts only translation, so a U-turn looked like
#      "no progress" and triggered recoveries.
#   6. inflation_radius 0.40 -> 0.60 in both costmaps. An in-place turn sweeps
#      the footprint's circumscribed radius, sqrt(0.45^2 + 0.35^2) = 0.57 m,
#      so paths now keep that much room from walls where the space allows.
#   7. collision_monitor StopZone/SlowdownZone points: flat double list ->
#      string of [x, y] pairs, same polygons. Jazzy rejected the old type and
#      the monitor never activated (2026-11-07 sim).
#
#
# CARRIED FROM v29 (2026-11-07, Mode 1 speed and smoothness, tested in Gazebo
# small_house: 5/5 goals at 0.50 m/s, 0 "collision ahead"):
#   1. RPP desired_linear_vel 0.25 -> 0.50, max_linear_accel 0.25 -> 0.40;
#      velocity_smoother linear max_velocity 0.25 -> 0.50, max_accel
#      0.25 -> 0.40, max_decel -0.25 -> -0.50.
#   2. RPP max_angular_accel 3.2 -> 16.0. 3.2 made RPP ask 0.16 rad/s from
#      rest, which sat in the real chair's motor deadband (bag
#      session_20261107_000512); the OPEN_LOOP smoother still ramps at 1.2.
###############################################################################
###############################################################################
# AMCL - RPLIDAR S3 OPTIMIZED
###############################################################################
amcl:
  ros__parameters:
    use_sim_time: false
    min_particles: 3000
    max_particles: 8000
    kld_err: 0.01
    kld_z: 0.99
    pf_err: 0.01
    pf_z: 0.99
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    laser_model_type: "likelihood_field"
    max_beams: 360
    laser_max_range: 25.0
    laser_min_range: 0.05
    laser_likelihood_max_dist: 2.0
    sigma_hit: 0.20            # v17: anti-kidnap
    z_hit: 0.95
    z_rand: 0.04
    z_max: 0.005
    z_short: 0.005
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    update_min_d: 0.01            # v29: TF stays fresh when stationary
    update_min_a: 0.01            # v29: TF stays fresh when stationary
    laser_scan_timeout: 1.0
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    tf_broadcast: true
    transform_tolerance: 1.0
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: /scan_fused
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    initial_cov_xx: 0.15
    initial_cov_yy: 0.15
    initial_cov_aa: 0.12
    initial_cov_xy: 0.0
    initial_cov_xa: 0.0
    initial_cov_ya: 0.0
    always_reset_initial_pose: false
    first_map_only: false
    save_pose_rate: 10.0
    gui_publish_rate: 5.0

###############################################################################
# BT NAVIGATOR
###############################################################################
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 60.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    transform_tolerance: 1.0
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

###############################################################################
# CONTROLLER SERVER - JETSON-OPTIMIZED SMOOTH PATH FOLLOWING
###############################################################################
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0

    progress_checker_plugins: ["progress_checker"]
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"   # v31: in-place turns count as progress
      required_movement_radius: 0.05
      required_movement_angle: 0.5                     # v31: rad
      movement_time_allowance: 10.0                    # v31: 4.0 -> 10.0

    goal_checker_plugins: ["general_goal_checker"]
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28
      stateful: true

    controller_plugins: ["FollowPath"]
    odom_topic: /odometry/filtered

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.50            # from v29: 0.25 -> 0.50 cruise
      max_linear_accel: 0.40              # from v29: 0.25 -> 0.40
      max_linear_decel: 0.50
      lookahead_dist: 0.70
      min_lookahead_dist: 0.50
      max_lookahead_dist: 1.20
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true         # v31: turn in place to face the path
      rotate_to_heading_min_angle: 0.785  # v31: 0.35 -> 0.785 (45 deg); below that, drive a curve
      rotate_to_heading_angular_vel: 0.8  # 0.5 made a U-turn too slow on the real chair
      max_angular_accel: 16.0             # from v29: 3.2 -> 16.0, RPP asks the full turn speed at once; 0.16 rad/s stalled in the real chair deadband
      allow_reversing: false              # v31: never reverse while following a path
      transform_tolerance: 5.0    # v29: tolerate AMCL TF gaps
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true       # v31: stop before the footprint hits an obstacle
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.2
      regulated_linear_scaling_min_speed: 0.15
      cost_scaling_dist: 0.25
      cost_scaling_gain: 0.8
      inflation_cost_scaling_factor: 2.5
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.35
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false

###############################################################################
# LOCAL COSTMAP - Jetson-optimized rates
###############################################################################
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[0.45, 0.35], [0.45, -0.35], [-0.45, -0.35], [-0.45, 0.35]]"
      footprint_padding: 0.03
      transform_tolerance: 1.0
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1

        scan:
          topic: /scan_fused
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.40
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.60          # v31: 0.40 -> 0.60, >= circumscribed radius 0.57 m for in-place turns

      always_send_full_costmap: false
      track_unknown_space: true

###############################################################################
# GLOBAL COSTMAP - /scan_fused with matched inflation
###############################################################################
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[0.45, 0.35], [0.45, -0.35], [-0.45, -0.35], [-0.45, 0.35]]"
      footprint_padding: 0.03
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 5.0    # v29: tolerate AMCL TF gaps
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
        map_topic: /map

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true

        scan:
          topic: /scan_fused
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.40

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.60          # v31: 0.40 -> 0.60, >= circumscribed radius 0.57 m for in-place turns

      always_send_full_costmap: false

###############################################################################
# PLANNER SERVER - SmacPlanner2D (CPU-optimized for 684K cell grid)
###############################################################################
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.5
    use_sim_time: false
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: true     # plan at 0.04 m: at the map's 0.02 m, 17 m routes hit max_iterations
      downsampling_factor: 2
      allow_unknown: true
      max_iterations: 500000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      cost_travel_multiplier: 1.0
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

###############################################################################
# SMOOTHER SERVER
###############################################################################
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 2000
      do_refinement: true
      refinement_num: 3
      w_smooth: 0.4
      w_data: 0.2

###############################################################################
# BEHAVIOR SERVER - WHEELCHAIR-SAFE RECOVERY
###############################################################################
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.35
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.5

###############################################################################
# VELOCITY SMOOTHER - PASSENGER COMFORT (Jetson-optimized)
###############################################################################
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 40.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.50, 0.0, 0.80]   # linear 0.25 -> 0.50 from v29; angular 0.50 -> 0.80 to match rotate_to_heading_angular_vel
    min_velocity: [-0.15, 0.0, -0.80]
    max_accel: [0.40, 0.0, 1.2]       # linear 0.25 -> 0.40 from v29; angular 0.8 -> 1.2
    max_decel: [-0.50, 0.0, -1.2]     # from v29: linear -0.25 -> -0.50, 0.25 m to stop from 0.50 m/s
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.02]
    velocity_timeout: 1.0

###############################################################################
# WAYPOINT FOLLOWER
###############################################################################
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

###############################################################################
# COLLISION MONITOR (currently disabled via launch arg, wired for future use)
###############################################################################
collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel"
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowdownZone"]
    StopZone:
      type: "polygon"
      points: "[[0.55, 0.42], [0.55, -0.42], [-0.55, -0.42], [-0.55, 0.42]]"  # Jazzy wants a string of [x, y] pairs
      action_type: "stop"
      max_points: 3
      visualize: true
      polygon_pub_topic: "polygon_stop"
    SlowdownZone:
      type: "polygon"
      points: "[[0.95, 0.82], [0.95, -0.82], [-0.95, -0.82], [-0.95, 0.82]]"  # Jazzy wants a string of [x, y] pairs
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.3
      visualize: true
      polygon_pub_topic: "polygon_slowdown"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_fused"
      min_range: 0.10
      max_range: 10.0
