# ============================================================================
# NAV2 - SIMULATION OVERRIDES
# ============================================================================
# Loaded AFTER wheelchair_navigation/config/nav2_params_3cam_v29.yaml, so the
# sim-only values below win over the real-robot ones. The real config is never
# edited: it stays exactly as it is on the robot.
#
# Simulation differences from the real launch:
#   1. time - Gazebo publishes /clock, so every node needs use_sim_time: true.
#      The real config hardcodes false everywhere (wall clock, no /clock).
#   2. the laser topic - on the robot the costmaps, AMCL and the collision monitor read /scan_fused,
#      which is produced by the 3x RealSense fusion pipeline. That pipeline does
#      not run in Gazebo, so the raw bridged /scan is used instead.
#   3. localization - sim EKF uses axle-corrected lateral velocity, with Omni AMCL.
#      Real Mode 3 uses corrected ZUPT output and the same AMCL motion model.
#   4. safety map - the Mode 3 script loads small_house_clearance.yaml, including
#      collision geometry to 2.1 m; it also enables native contact telemetry.
#      Footprint and velocity limits are inherited from v30 for both runs.
#
# The planner, controller, footprint and velocity limits are inherited. The
# simulation inflation radius below remains 0.65 m, as documented in AGENTS.md.
#
# Usage:
#   ros2 launch wheelchair_description gazebo_sim.launch.py nav2:=true
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: true
    scan_topic: /scan
    # base_link is 0.32 m ahead of the axle, so a spin includes lateral motion.
    # The differential model decomposes that swing into two near-90-degree
    # rotations, injecting ~0.49 m/rad noise per scan at the existing alphas.
    # Match axle-corrected sim odometry; the Mode 3 real launcher also shifts ZUPT.
    robot_model_type: "nav2_amcl::OmniMotionModel"

bt_navigator:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        scan:
          topic: /scan
      # The costmap node is /local_costmap/local_costmap, so the params must be
      # nested twice, exactly like the real config. With a single level they
      # silently never apply.
      # 0.65 is wider than the circumscribed radius (0.612 m), which keeps the
      # planner path away from walls with extra margin in the sim.
      inflation_layer:
        inflation_radius: 0.65

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        scan:
          topic: /scan
      inflation_layer:
        inflation_radius: 0.65

planner_server:
  ros__parameters:
    use_sim_time: true

smoother_server:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true

collision_monitor:
  ros__parameters:
    use_sim_time: true
    scan:
      topic: /scan
