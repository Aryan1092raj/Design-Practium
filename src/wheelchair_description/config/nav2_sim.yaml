# ============================================================================
# NAV2 - SIMULATION OVERRIDES
# ============================================================================
# Loaded AFTER wheelchair_navigation/config/nav2_params_3cam_v29.yaml, so the
# sim-only values below win over the real-robot ones. The real config is never
# edited: it stays exactly as it is on the robot.
#
# Only three things differ between the robot and Gazebo:
#   1. time - Gazebo publishes /clock, so every node needs use_sim_time: true.
#      The real config hardcodes false everywhere (wall clock, no /clock).
#   2. the laser topic - on the robot the costmaps and AMCL read /scan_fused,
#      which is produced by the 3x RealSense fusion pipeline. That pipeline does
#      not run in Gazebo, so the raw bridged /scan is used instead.
#   3. footprint - the robot is 0.45 x 0.35 m, but the Gazebo collision box of
#      wc_gazebo.xacro is slightly different, so the sim uses the URDF value.
#
# Everything else (planner, controller, velocity limits, inflation radius) is
# inherited from the real config, so behaviour in the sim matches the robot.
#
# Usage:
#   ros2 launch wheelchair_description gazebo_sim.launch.py nav2:=true
# ============================================================================

amcl:
  ros__parameters:
    use_sim_time: true
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        scan:
          topic: /scan
      # The costmap node is /local_costmap/local_costmap, so the params must be
      # nested twice, exactly like the real config. With a single level they
      # silently never apply.
      # 0.65 is wider than the circumscribed radius (0.612 m), which keeps the
      # planner path away from walls with extra margin in the sim.
      inflation_layer:
        inflation_radius: 0.65

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      obstacle_layer:
        scan:
          topic: /scan
      inflation_layer:
        inflation_radius: 0.65

planner_server:
  ros__parameters:
    use_sim_time: true

smoother_server:
  ros__parameters:
    use_sim_time: true

behavior_server:
  ros__parameters:
    use_sim_time: true

velocity_smoother:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true

collision_monitor:
  ros__parameters:
    use_sim_time: true