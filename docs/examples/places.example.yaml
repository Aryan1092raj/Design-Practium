# Proposed per-map places file. Lives next to the map it was recorded on:
#   maps/<session>/places.yaml
# Poses are in the map frame; yaw is in radians. Same entry shape as the current
# src/wheelchair_description/config/locations.yaml, so existing go_to() code reads it unchanged.
# Keep each spot >= 1.3 m from furniture (chair footprint 0.9 x 0.7 m plus costmap inflation).

home:        {x: 0.00,  y: 0.00,  yaw: 0.00}    # map origin = where mapping started; used for /initialpose
bedroom:     {x: -4.54, y: -0.14, yaw: 2.22}
kitchen:     {x: 4.64,  y: -1.98, yaw: 0.99}
living_room: {x: 0.20,  y: 1.48,  yaw: -1.53}
